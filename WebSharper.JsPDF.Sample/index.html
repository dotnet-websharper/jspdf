<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebSharper.JsPDF Sample</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }

        html, body { margin: 0; height: 100%; }
        .pdf-holder {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="main" ws-children-template="Main">
        <div class="pdf-holder">
            <div ws-replace="PDF"></div>
        </div>
    </div>
    <script type="module" src="Scripts/WebSharper.JsPDF.Sample.min.js"></script>
</body>
</html>
